[project]
name = "anki-bot"
version = "0.2.0"
description = "Telegram bot for creating Japanese vocabulary Anki flashcards from manga"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiogram>=3.10",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "anki",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.1",
    "onnxruntime>=1.25.0",
    "fugashi[unidic-lite]>=1.5.2",
    "wordfreq>=3.1.1",
    "jaconv>=0.5.0",
    "manga-ocr>=0.1.14",
    "mecab-python3>=1.0.12",
    "ipadic>=1.0.0",
]

[project.optional-dependencies]
panels = [
    "onnxruntime",
    "numpy",
    "networkx",
    "shapely",
    "Pillow>=10.0",
]
panels-torch = [
    "torch>=2.0",
    "transformers>=4.44,<5",
    "networkx",
    "shapely",
    "numpy",
    "einops",
    "pulp",
    "scipy",
    "matplotlib",
    "timm",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
