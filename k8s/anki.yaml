---
# anki-sync Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-sync
  namespace: anki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anki-sync
  template:
    metadata:
      labels:
        app: anki-sync
    spec:
      containers:
      - name: anki-sync
        image: docker.io/library/anki_mcp-anki-sync:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: anki-env
        volumeMounts:
        - name: sync-data
          mountPath: /data
      volumes:
      - name: sync-data
        hostPath:
          path: /home/thiago/repos/anki_mcp/data/sync
          type: DirectoryOrCreate
---
# anki-sync ClusterIP Service (internal, for anki-bot)
apiVersion: v1
kind: Service
metadata:
  name: anki-sync
  namespace: anki
spec:
  selector:
    app: anki-sync
  ports:
  - port: 8080
    targetPort: 8080
---
# anki-sync LoadBalancer Service (external, for Anki clients on Tailnet)
apiVersion: v1
kind: Service
metadata:
  name: anki-sync-external
  namespace: anki
spec:
  type: LoadBalancer
  selector:
    app: anki-sync
  ports:
  - port: 8080
    targetPort: 8080
---
# anki-bot Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-bot
  namespace: anki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anki-bot
  template:
    metadata:
      labels:
        app: anki-bot
    spec:
      containers:
      - name: anki-bot
        image: docker.io/library/anki_mcp-anki-bot:latest
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: anki-env
        volumeMounts:
        - name: mcp-data
          mountPath: /data
      volumes:
      - name: mcp-data
        hostPath:
          path: /home/thiago/repos/anki_mcp/data/mcp
          type: DirectoryOrCreate
